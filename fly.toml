# Fly.io deploy for Roundup. One machine, always on (the iMessage connection must stay open),
# a small disk for trips, and a permanent https address: https://roundup-imessage.fly.dev
app = "roundup-imessage"
primary_region = "iad"

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  TUNNEL = "false"
  PUBLIC_URL = "https://roundup-imessage.fly.dev"
  STATE_FILE = "/data/state.json"
  IMESSAGE_MODE = "cloud"

[mounts]
  source = "roundup_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
